# IncidentGraph stack.
#
# DEFAULT profile = the real dev stack: postgres(pgvector) + api + worker +
# mcp-server. Everything starts with `docker compose up -d`.
#
# External integrations are opt-in via profiles and REQUIRE you to supply a
# real image (IncidentGraph does not ship or fake third-party services):
#   HERMES_IMAGE=... docker compose --profile hermes up -d
#   OPENCLAW_IMAGE=... docker compose --profile openclaw up -d
#   DURABLEMCP_IMAGE=... docker compose --profile durablemcp up -d
#
# MCP is wired on ONE canonical port: 8091 (api on 8090). Hermes receives
# INCIDENTGRAPH_MCP_URL=http://mcp-server:8091/mcp plus IG_MCP_TOKEN.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: incidentgraph
      POSTGRES_PASSWORD: incidentgraph
      POSTGRES_DB: incidentgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentgraph -d incidentgraph"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/api"]
    environment:
      IG_DATABASE_URL: postgres://incidentgraph:incidentgraph@postgres:5432/incidentgraph?sslmode=disable
      IG_READONLY_DATABASE_URL: postgres://incidentgraph:incidentgraph@postgres:5432/incidentgraph?sslmode=disable
      IG_HTTP_ADDR: ":8090"
      IG_LLM_PROVIDER: mock
      IG_DURABLEMCP_URL: http://durablemcp:8080
      IG_RUN_LEASE_TTL: 60s
      IG_MCP_AUTH_ENABLED: "true"
      IG_MCP_TOKEN: ${IG_MCP_TOKEN:-dev-mcp-token}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/worker"]
    environment:
      IG_DATABASE_URL: postgres://incidentgraph:incidentgraph@postgres:5432/incidentgraph?sslmode=disable
      IG_LLM_PROVIDER: mock
      IG_DURABLEMCP_URL: http://durablemcp:8080
      IG_RUN_LEASE_TTL: 60s
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/app/mcp-server", "-addr", ":8091"]
    environment:
      IG_DATABASE_URL: postgres://incidentgraph:incidentgraph@postgres:5432/incidentgraph?sslmode=disable
      IG_MCP_AUTH_ENABLED: "true"
      IG_MCP_TOKEN: ${IG_MCP_TOKEN:-dev-mcp-token}
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- optional
  # External integrations live in docker/compose.integrations.yml because
  # IncidentGraph does not ship third-party images. Enable with:
  #
  #   HERMES_IMAGE=<image> OPENCLAW_IMAGE=<image> DURABLEMCP_IMAGE=<image> \
  #     IG_OPENCLAW_VERIFY_TOKEN=<token> \
  #     docker compose -f docker-compose.yml -f docker/compose.integrations.yml up -d

volumes:
  pgdata:
